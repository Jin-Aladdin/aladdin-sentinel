inventory_version: 0.1.0
defaults:
  commit_max_age_days: 120
  validation_max_age_days: 45
  require_enabled_workflows: true
repositories:
- repository: Jin-Aladdin/aladdin-spec
  role: specification
  thresholds:
    validation_max_age_days: 45
    commit_max_age_days: 180
  recovery:
    enabled: false
  notes: The specification repository. It runs no knowledge updates by design (ADR-0005),
    so no update threshold applies. Ownership is moving to Aladdin-Knowledge; update this
    entry when the transfer happens.
- repository: Jin-Aladdin/aladdin-sentinel
  role: sentinel
  thresholds:
    commit_max_age_days: 200
    validation_max_age_days: null
  recovery:
    enabled: false
  notes: 'The sentinel watches itself. That is a partial mitigation, not a solution: a sentinel
    that has stopped running cannot report its own silence. It does catch the case where it
    still runs and its own checks fail. Nothing outside this repository observes it.'
- repository: Jin-Aladdin/aladdin-kb-weather
  role: knowledge-pack
  thresholds:
    commit_max_age_days: 180
    validation_max_age_days: 45
    update_max_age_days: 90
    release_max_age_days: null
  recovery:
    enabled: false
  notes: Added automatically by sentinel discovery. Thresholds are the conservative defaults
    for a pack whose rhythm is not yet known; tighten them once it has one.
reporting:
  open_issues: true
  issue_label: sentinel
  fail_workflow_on_unhealthy: false
